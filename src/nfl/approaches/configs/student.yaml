# The data-only line and the headline (ADR 0012, 0018, 0031). Starts with every football group
# weighted equally and lets history move the weights. Model wave 3 (ADR 0031, 2026-11-20) folded the
# Student v2 into it: home field is measured on the last ten training seasons (`shift_10`), and the
# fitted venue modifiers (domes, turf, division games, primetime) are out, because since 2016 they
# cost accuracy (-0.0016 log loss without them, with the shift). Home field is zero at neutral sites
# by rule (engine.NEUTRAL), for every approach. Buzz and the context-only groups are excluded. Its one
# declared input is line movement: it exists live only, so its weight stays where this file sets it.
id: student
name: The Student
blurb: >-
  Has no opinions. Starts by weighting everything equally and learns from results, with home field
  measured on the last ten seasons. The one thing it takes on trust is a big line move, which has no
  history to learn from.
emphasis: []
calibration: shift_10  # one offset on the last ten training seasons (M23.0; ADR 0031)
public: fitted  # its identity is what the data says; the equal-weight start is shown as its persona
intercept: {w: 0.0, why: "Learns home field from the last ten seasons"}
groups:
  quality:       {w: 0.1, why: "Equal start"}
  offense:       {w: 0.1, why: "Equal start"}
  defense:       {w: 0.1, why: "Equal start"}
  quarterback:   {w: 0.1, why: "Equal start"}
  health:        {w: 0.1, why: "Equal start"}
  form:          {w: 0.1, why: "Equal start"}
  stakes:        {w: 0.1, why: "Equal start"}
  rest_travel:   {w: 0.1, why: "Equal start"}
  special_teams: {w: 0.1, why: "Equal start"}
  market:        {w: 0.065, why: "Declared, not learned: line moves have no history"}
overrides:
  market: {market.line_move_pts: 1.0}
