# See traditionalist.yaml for units. Redefined 2026-10-27 (ADR 0013): the market's own forecast is
# never an input. The Sharp reads how the market *behaves* (capped at 20% of the budget) and
# otherwise trusts what the public underrates. Line movement and public betting exist live only, so
# its historical record is mostly its football weights; its market-reading identity shows up live.
id: sharp
name: The Sharp
blurb: >-
  Thinks like a professional bettor without copying the line: follows where the line moves, fades
  where the public piles in, trusts quarterback play and efficiency, and ignores streaks and hype.
emphasis: [quarterback, offense, market]
calibration: platt
intercept: {w: 0.15, why: "Home field is worth about a point and a half, no more"}
groups:
  quarterback: {w: 0.30, why: "Quarterback play is the most underpriced edge"}
  offense:     {w: 0.25, why: "Efficiency per play beats records and narratives"}
  market:      {w: 0.18, why: "Follow the line moves, fade the public"}
  defense:     {w: 0.10, why: "Defense matters, but it's noisier than offense"}
  quality:     {w: 0.10, why: "Results matter only as far as they reflect efficiency"}
  health:      {w: 0.10, why: "Injury news is often priced late"}
  form:        {w: -0.08, why: "Fade recency: the public overreacts to streaks"}
  buzz:        {w: -0.06, why: "Fade the hype"}
overrides:
  # His read of the market: moves toward a team are information; a crowded public side is not.
  market: {market.line_move_pts: 1.0, narrative.public_bet_pct_home: -1.0}
