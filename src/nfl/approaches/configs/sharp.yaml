# See traditionalist.yaml for units. Proposed by Claude 2026-10-27 at group level, for Austin's review.
id: sharp
name: The Sharp
blurb: >-
  Starts from the betting line, which already prices in almost everything, then fades what the
  public overrates (hot streaks, hype) and nudges toward what it underrates (efficiency, QB news).
emphasis: [market]
calibration: platt
intercept: {w: 0.0, why: "The line already includes home field"}
groups:
  market:      {w: 0.85, why: "The market number is the best forecast available"}
  quarterback: {w: 0.05, why: "QB news moves lines late; get there first"}
  offense:     {w: 0.05, why: "Efficiency the public underrates"}
  quality:     {w: 0.03, why: "Ratings the market can be slow to update"}
  health:      {w: 0.03, why: "Injury reports aren't always fully priced"}
  form:        {w: -0.05, why: "Fade recency bias: the public overreacts to streaks"}
  buzz:        {w: -0.10, why: "Fade the hype"}
