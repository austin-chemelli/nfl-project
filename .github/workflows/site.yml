name: site

# Build the React site and deploy it to Firebase Hosting (docs/site.md, M7.5). Data is not part of
# the deploy: the app reads the public bucket at runtime, so only code changes trigger this.
# Auth is keyless (Workload Identity); the deploy script calls the Hosting REST API.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/firebase_deploy.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Firebase Hosting
        env:
          # via env, never interpolated into the script (commit messages are untrusted text)
          MESSAGE: ${{ github.event.head_commit.message || 'manual deploy' }}
        run: python3 ../scripts/firebase_deploy.py --project "${{ vars.GCP_PROJECT_ID }}" --message "${GITHUB_SHA::7} ${MESSAGE%%$'\n'*}"
