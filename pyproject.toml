[project]
name = "nfl"
version = "0.1.0"
description = "Weekly NFL matchup breakdowns and predictions (POC)"
authors = [
    { name = "Austin Chemelli", email = "austinc1008@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "nflreadpy>=0.1.5",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
    "typer>=0.27.3",
]

[project.scripts]
nfl = "nfl.cli:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
